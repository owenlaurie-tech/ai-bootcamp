<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supabase Connection Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #f5f5f7;
        }
        .test-box {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #1d1d1f;
            margin-bottom: 8px;
        }
        .status {
            padding: 12px;
            border-radius: 8px;
            margin: 12px 0;
            font-weight: 600;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        button {
            background: #007aff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin: 8px 8px 8px 0;
        }
        button:hover {
            background: #0051d5;
        }
        pre {
            background: #f5f5f7;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
        }
        .input-group {
            margin: 16px 0;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .code {
            background: #f5f5f7;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <h1>🔍 Supabase Connection Diagnostic Tool</h1>
    <p>This tool will help you verify your Supabase configuration step-by-step.</p>

    <div class="test-box">
        <h2>Step 1: Enter Your Credentials</h2>
        <div class="input-group">
            <label>Supabase URL:</label>
            <input type="text" id="supabaseUrl" value="https://rbacdmvrbnfnqjjovfne.supabase.co" />
        </div>
        <div class="input-group">
            <label>Anon Public Key:</label>
            <input type="text" id="supabaseKey" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJiYWNkbXZyYm5mbnFqam92Zm5lIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI4ODQ4MDQsImV4cCI6MjA3ODQ2MDgwNH0.BLx2GakndBYtshobYluI1UQ5KnhSNJhnUyJndO4djlQ" />
            <small style="color: #666; margin-top: 4px; display: block;">
                Find this in: Supabase Dashboard → Settings → API → "anon public" key
            </small>
        </div>
    </div>

    <div class="test-box">
        <h2>Step 2: Run Tests</h2>
        <button onclick="runAllTests()">🧪 Run All Tests</button>
        <button onclick="clearResults()">🗑️ Clear Results</button>
        <div id="results"></div>
    </div>

    <div class="test-box">
        <h2>Step 3: Test Database Tables</h2>
        <button onclick="testTables()">📊 Check Database Tables</button>
        <div id="tableResults"></div>
    </div>

    <script>
        let supabaseClient = null;

        function clearResults() {
            document.getElementById('results').innerHTML = '';
            document.getElementById('tableResults').innerHTML = '';
        }

        function addResult(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        function addTableResult(message, type = 'info') {
            const results = document.getElementById('tableResults');
            const div = document.createElement('div');
            div.className = `status ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }

        async function runAllTests() {
            clearResults();

            const url = document.getElementById('supabaseUrl').value.trim();
            const key = document.getElementById('supabaseKey').value.trim();

            // Test 1: Check if values are provided
            addResult('🔍 <strong>Test 1:</strong> Checking if credentials are provided...', 'info');

            if (!url) {
                addResult('❌ Supabase URL is empty', 'error');
                return;
            }
            if (!key) {
                addResult('❌ Supabase Key is empty', 'error');
                return;
            }
            addResult('✅ Both URL and Key are provided', 'success');

            // Test 2: Check URL format
            addResult('🔍 <strong>Test 2:</strong> Validating URL format...', 'info');
            if (!url.startsWith('https://')) {
                addResult('❌ URL should start with https://', 'error');
                return;
            }
            if (!url.includes('.supabase.co')) {
                addResult('⚠️ URL doesn\'t look like a Supabase URL', 'error');
                return;
            }
            addResult('✅ URL format looks correct', 'success');

            // Test 3: Check Key format
            addResult('🔍 <strong>Test 3:</strong> Validating Key format...', 'info');
            if (!key.startsWith('eyJ')) {
                addResult('❌ Key should start with "eyJ" - you might have copied the wrong key', 'error');
                addResult('💡 Make sure you copied the <strong>anon public</strong> key, not the service_role key', 'info');
                return;
            }
            if (key.length < 100) {
                addResult('❌ Key seems too short - it should be 200+ characters', 'error');
                return;
            }
            addResult(`✅ Key format looks correct (${key.length} characters)`, 'success');

            // Test 4: Try to create Supabase client
            addResult('🔍 <strong>Test 4:</strong> Creating Supabase client...', 'info');
            try {
                supabaseClient = window.supabase.createClient(url, key);
                addResult('✅ Supabase client created successfully', 'success');
            } catch (error) {
                addResult(`❌ Failed to create client: ${error.message}`, 'error');
                return;
            }

            // Test 5: Test connection
            addResult('🔍 <strong>Test 5:</strong> Testing connection to Supabase...', 'info');
            try {
                const { data, error } = await supabaseClient.auth.getSession();
                if (error) {
                    addResult(`❌ Connection failed: ${error.message}`, 'error');
                    addResult(`💡 This usually means: <br>
                        1. The API key is incorrect<br>
                        2. The URL is wrong<br>
                        3. Your Supabase project is paused/deleted`, 'info');
                    return;
                }
                addResult('✅ Successfully connected to Supabase!', 'success');
            } catch (error) {
                addResult(`❌ Connection error: ${error.message}`, 'error');
                return;
            }

            // Test 6: Try to sign up a test user
            addResult('🔍 <strong>Test 6:</strong> Testing authentication...', 'info');
            const testEmail = `test_${Date.now()}@example.com`;
            const testPassword = 'testpassword123';

            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: testEmail,
                    password: testPassword,
                });

                if (error) {
                    // Check if it's a rate limit or expected error
                    if (error.message.includes('rate limit') || error.message.includes('Email rate limit')) {
                        addResult('⚠️ Rate limited (this is actually good - it means auth is working!)', 'success');
                    } else {
                        addResult(`❌ Auth test failed: ${error.message}`, 'error');
                    }
                } else {
                    addResult('✅ Authentication is working! You can sign up users.', 'success');
                    addResult(`📧 Test user created: ${testEmail}`, 'info');
                }
            } catch (error) {
                addResult(`❌ Auth test error: ${error.message}`, 'error');
            }

            addResult('<br><strong>🎉 All basic tests passed! Your configuration is correct.</strong>', 'success');
        }

        async function testTables() {
            document.getElementById('tableResults').innerHTML = '';

            if (!supabaseClient) {
                addTableResult('⚠️ Please run "Run All Tests" first to create a client', 'error');
                return;
            }

            addTableResult('🔍 Checking database tables...', 'info');

            // Test profiles table
            try {
                const { data, error } = await supabaseClient.from('profiles').select('*').limit(1);
                if (error) {
                    if (error.message.includes('relation "public.profiles" does not exist')) {
                        addTableResult('❌ Table "profiles" does not exist - SQL migration may not have run', 'error');
                    } else {
                        addTableResult(`❌ Profiles table error: ${error.message}`, 'error');
                    }
                } else {
                    addTableResult('✅ Table "profiles" exists', 'success');
                }
            } catch (error) {
                addTableResult(`❌ Profiles test failed: ${error.message}`, 'error');
            }

            // Test tasks table
            try {
                const { data, error } = await supabaseClient.from('tasks').select('*').limit(1);
                if (error) {
                    if (error.message.includes('relation "public.tasks" does not exist')) {
                        addTableResult('❌ Table "tasks" does not exist - SQL migration may not have run', 'error');
                    } else {
                        addTableResult(`❌ Tasks table error: ${error.message}`, 'error');
                    }
                } else {
                    addTableResult('✅ Table "tasks" exists', 'success');
                }
            } catch (error) {
                addTableResult(`❌ Tasks test failed: ${error.message}`, 'error');
            }

            // Test task_tags table
            try {
                const { data, error } = await supabaseClient.from('task_tags').select('*').limit(1);
                if (error) {
                    if (error.message.includes('relation "public.task_tags" does not exist')) {
                        addTableResult('❌ Table "task_tags" does not exist', 'error');
                    } else {
                        addTableResult(`❌ Task_tags table error: ${error.message}`, 'error');
                    }
                } else {
                    addTableResult('✅ Table "task_tags" exists', 'success');
                }
            } catch (error) {
                addTableResult(`❌ Task_tags test failed: ${error.message}`, 'error');
            }

            // Test recurring_patterns table
            try {
                const { data, error } = await supabaseClient.from('recurring_patterns').select('*').limit(1);
                if (error) {
                    if (error.message.includes('relation "public.recurring_patterns" does not exist')) {
                        addTableResult('❌ Table "recurring_patterns" does not exist', 'error');
                    } else {
                        addTableResult(`❌ Recurring_patterns table error: ${error.message}`, 'error');
                    }
                } else {
                    addTableResult('✅ Table "recurring_patterns" exists', 'success');
                }
            } catch (error) {
                addTableResult(`❌ Recurring_patterns test failed: ${error.message}`, 'error');
            }

            addTableResult('<br><strong>💡 If tables are missing:</strong><br>1. Go to Supabase SQL Editor<br>2. Paste the contents of supabase-migration.sql<br>3. Click "Run"<br>4. Refresh this page and test again', 'info');
        }
    </script>
</body>
</html>
